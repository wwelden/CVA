# Builds the WebGL player with Unity (GameCI) and deploys it to Vercel production
# (cva-psi.vercel.app). Vercel can't run Unity, so the build happens here and the
# finished Builds/WebGL folder is uploaded with the Vercel CLI.
#
# Required repository secrets:
#   UNITY_LICENSE   contents of your Unity_lic.ulf (Personal license works)
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
#   VERCEL_TOKEN    token from https://vercel.com/account/tokens
name: Deploy WebGL to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a build that's still running.
concurrency:
  group: deploy-webgl
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check deployment credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See DEPLOYMENT.md."
              missing=1
            fi
          done
          exit "$missing"

      # The Unity editor image plus the Library import outgrow the default runner disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Reusing the imported Library cuts later builds from ~40 to ~15 minutes.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      # Runs WebGLBuild.Build, which writes Builds/WebGL (including its vercel.json).
      - name: Build WebGL player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLBuild.Build
          manualExit: true
          versioning: None

      # The build container runs as root.
      - name: Take ownership of build output
        run: sudo chown -R "$(id -u):$(id -g)" Builds

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_gKkroO4XiWdxmxF0cBs6LLl5
          VERCEL_PROJECT_ID: prj_uizfR8NZJUbhbLFyb67qBJoCWBrp
        run: bunx vercel@64.1.0 deploy Builds/WebGL --prod --yes
